<title>Sweetify by Rufin</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f3faf8;--card:#fff;--tx:#10302c;--mut:#5b7a75;--pri:#0f766e;--pri2:#10b981;--bd:#d5ebe6;--ok:#0f9d6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1716;--card:#12211f;--tx:#e8f5f2;--mut:#9bbdb6;--bd:#21403b}}
:root[data-theme="dark"]{--bg:#0b1716;--card:#12211f;--tx:#e8f5f2;--mut:#9bbdb6;--bd:#21403b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
.top{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;font-size:12px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top select{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:3px 6px}
.top option{color:#222}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo b{font-size:21px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.logo small{font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.search{flex:1;min-width:0}.search input{width:100%;padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.cartb{position:relative;font-size:18px;padding:8px 12px}
.cartb i{position:absolute;top:-6px;right:-6px;background:var(--ok);color:#fff;font-style:normal;font-size:11px;border-radius:99px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.hero{border-radius:22px;padding:28px 22px;color:#fff;background:linear-gradient(120deg,#0b5d57,#0f9d8a 68%,#f59e0b);margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.1}.hero p{margin:0 0 14px;opacity:.92;max-width:560px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:130px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff}
.tag.u{background:#f59e0b;color:#222}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cb h3{margin:0;font-size:15px}.cb small{color:var(--mut)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}.pr b{font-size:17px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.box h2{margin:0 0 10px;font-size:17px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;font-weight:600;display:block}.f .w{grid-column:1/-1}
.f input,.f select{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--pri);background:rgba(15,118,110,.09)}
.ov{position:fixed;inset:0;background:rgba(10,0,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.q{display:flex;align-items:center;gap:6px}.q button{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}.search{display:none}.f{grid-template-columns:1fr}}
.anon .noprint,.anon .search,.anon .cartb,.anon #userBtn{display:none}.auth{max-width:420px;margin:24px auto}
a{color:var(--pri);cursor:pointer}.box p{line-height:1.55}
footer{border-top:1px solid var(--bd);background:var(--card);padding:26px 14px;margin-top:20px}.fg{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}.fg div{display:flex;flex-direction:column;gap:8px}.fg a{font-size:13px;color:var(--mut)}.fb{max-width:1100px;margin:18px auto 0;font-size:12px;color:var(--mut)}
@media print{.top,header,footer,.noprint{display:none!important}}
.trust{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.95}
</style>
</head>

buy:{t:{fr:'Comment acheter',en:'How to buy'},b:{fr:['Parcourez ou recherchez un article, filtrez par état (neuf ou occasion) et ajoutez-le au panier.','À la commande, choisissez votre pays : les moyens de paiement et la devise s’adaptent automatiquement.','Après le paiement, vous recevez une facture avec un numéro de suivi. Vous pouvez contacter notre support à tout moment.'],en:['Browse or search, filter by condition (new or used) and add items to your cart.','At checkout choose your country: payment methods and currency adapt automatically.','After payment you get an invoice with a tracking number. You can contact our support at any time.']}},
sell:{t:{fr:'Comment vendre',en:'How to sell'},b:{fr:['Créez un compte, appuyez sur « Vendre » puis indiquez le nom, le prix, l’état (neuf ou occasion) et la catégorie.','Décrivez honnêtement l’état de l’article et ajoutez de vraies photos. Les annonces trompeuses sont retirées.','Frais de service : {fee} % du prix de vente, prélevés uniquement lorsque l’article est vendu.','Expédiez sous 3 jours ouvrés avec un numéro de suivi. Le paiement est versé au vendeur après confirmation de la livraison.'],en:['Create an account, tap “Sell”, then enter name, price, condition (new or used) and category.','Describe the condition honestly and add real photos. Misleading listings are removed.','Service fee: {fee}% of the sale price, charged only when the item sells.','Ship within 3 business days with a tracking number. The seller is paid once delivery is confirmed.']}},
protection:{t:{fr:'Protection acheteur et retours',en:'Buyer protection and returns'},b:{fr:['Si l’article n’arrive pas ou diffère fortement de la description, vous êtes remboursé.','Signalez le problème dans les 14 jours après la date de livraison estimée, via la page Contact.','Rétractation : 14 jours pour retourner un article neuf acheté auprès d’un vendeur professionnel, selon la loi applicable. Les frais de retour peuvent être à votre charge.','Les remboursements sont effectués par le moyen de paiement d’origine sous 5 à 10 jours ouvrés après validation.'],en:['If an item does not arrive or differs greatly from its description, you are refunded.','Report the problem within 14 days of the estimated delivery date through the Contact page.','Withdrawal: 14 days to return a new item bought from a professional seller, as the applicable law provides. Return costs may be at your expense.','Refunds go back to the original payment method within 5 to 10 business days after approval.']}},
prohibited:{t:{fr:'Articles interdits',en:'Prohibited items'},b:{fr:['Armes, munitions et explosifs.','Drogues, médicaments sans ordonnance et substances illégales.','Contrefaçons, copies de marques et articles volés.','Produits dangereux, espèces protégées, restes humains.','Contenus pour adultes, haineux ou illégaux ; documents d’identité, cartes bancaires et données personnelles.','Tout article dont la vente est interdite dans le pays du vendeur ou de l’acheteur. Les annonces non conformes sont supprimées et les comptes peuvent être suspendus.'],en:['Weapons, ammunition and explosives.','Drugs, prescription-only medicines and illegal substances.','Counterfeits, brand copies and stolen goods.','Dangerous products, protected species, human remains.','Adult, hateful or illegal content; ID documents, bank cards and personal data.','Anything illegal to sell in the seller’s or buyer’s country. Non-compliant listings are removed and accounts may be suspended.']}},
terms:{t:{fr:'Conditions d’utilisation',en:'Terms of use'},b:{fr:['Ces conditions régissent l’utilisation de {brand}, exploité par {company}. En créant un compte, vous les acceptez.','Compte : vous devez avoir 18 ans ou plus, fournir des informations exactes et protéger votre mot de passe.','{brand} est une place de marché : les ventes se font entre vendeurs et acheteurs ; nous facilitons la mise en relation, le paiement et le suivi.','Sont interdits : la fraude, les fausses annonces, la manipulation des avis, le contournement des paiements et tout usage illégal.','Nous pouvons suspendre un compte ou retirer une annonce qui enfreint ces règles. Notre responsabilité est limitée dans la mesure permise par la loi.','Droit applicable et tribunaux compétents : [à compléter]. Dernière mise à jour : [date].'],en:['These terms govern the use of {brand}, operated by {company}. By creating an account you accept them.','Account: you must be 18 or older, give accurate information and protect your password.','{brand} is a marketplace: sales are between sellers and buyers; we facilitate matching, payment and tracking.','Prohibited: fraud, fake listings, review manipulation, bypassing payments and any illegal use.','We may suspend an account or remove a listing that breaks these rules. Our liability is limited as far as the law allows.','Governing law and courts: [to complete]. Last updated: [date].']}},
privacy:{t:{fr:'Politique de confidentialité',en:'Privacy policy'},b:{fr:['Données collectées : nom, email, téléphone, adresse de livraison, historique de commandes et d’annonces.','Utilisation : gérer votre compte, vos commandes, la livraison, le paiement, la prévention de la fraude et le support.','Partage : avec les vendeurs, transporteurs et prestataires de paiement nécessaires à la commande. Nous ne vendons pas vos données.','Vos droits : accès, correction et suppression de vos données sur demande à {email}.','Conservation : pendant la durée du compte et les délais légaux. Connexion chiffrée (HTTPS).'],en:['Data collected: name, email, phone, delivery address, order and listing history.','Use: manage your account, orders, delivery, payment, fraud prevention and support.','Sharing: with sellers, carriers and payment providers needed for your order. We do not sell your data.','Your rights: access, correct and delete your data by writing to {email}.','Retention: for the life of the account and legal periods. Encrypted connection (HTTPS).']}},
cookies:{t:{fr:'Cookies',en:'Cookies'},b:{fr:['Cookies essentiels : connexion et panier, indispensables au fonctionnement du site.','Mesure d’audience ou publicité : uniquement avec votre consentement [à activer si tu ajoutes des outils comme Google Analytics].','Vous pouvez effacer ou bloquer les cookies dans les réglages de votre navigateur.'],en:['Essential cookies: login and cart, required for the site to work.','Analytics or advertising: only with your consent [enable if you add tools such as Google Analytics].','You can clear or block cookies in your browser settings.']}},
legal:{t:{fr:'Mentions légales',en:'Legal notice'},b:{fr:['Éditeur : {company} — {rccm}','Adresse : {address} · Email : {email} · Téléphone : {phone}','Directeur de publication : [nom]. Hébergeur : [Netlify / Vercel / autre].'],en:['Publisher: {company} — {rccm}','Address: {address} · Email: {email} · Phone: {phone}','Publication director: [name]. Host: [Netlify / Vercel / other].']}},
faq:{t:{fr:'Centre d’aide',en:'Help center'},b:{fr:['Où est ma commande ? Utilisez le numéro de suivi de votre facture ou écrivez-nous via Contact.','Comment être remboursé ? Voir « Protection acheteur et retours ».','Mot de passe oublié ? [à activer avec Supabase : Authentication > Email templates].','Un vendeur ne répond pas ou un article est suspect ? Signalez-le via Contact (objet « Signaler »).'],en:['Where is my order? Use the tracking number on your invoice or write to us via Contact.','How do I get a refund? See “Buyer protection and returns”.','Forgot your password? [enable with Supabase: Authentication > Email templates].','A seller does not answer or an item looks suspicious? Report it via Contact (subject “Report”).']}}};
const pg=k=>({t:PG[k].t[S.lang]||PG[k].t.en,b:PG[k].b[S.lang]||PG[k].b.en});
const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>esc(k==='fee'?CONFIG.feePercent:(CONFIG[k]??m)));
function pageView(k){const p=pg(k);return `<button class="btn alt" onclick="go('shop')">${t('back')}</button><div class="box" style="margin-top:12px"><h2>${p.t}</h2>${p.b.map(s=>`<p>${fill(s)}</p>`).join('')}</div>`}
function contactView(){const C=CONFIG,u=S.user;return `<button class="btn alt" onclick="go('shop')">${t('back')}</button><div class="two" style="margin-top:12px"><div class="box"><h2>${xs('cT')}</h2><p style="color:var(--mut)">${xs('cS')}</p><form onsubmit="sendMsg(event)" class="f" style="grid-template-columns:1fr"><label>${at('nm')}<input name="nm" required value="${esc(u?u.name:'')}"></label><label>${t('em')}<input name="em" type="email" required value="${esc(u?u.email:'')}"></label><label>${xs('subjL')}<select name="sj">${xs('subj').map(s=>`<option>${s}</option>`).join('')}</select></label><label>${xs('msg')}<textarea name="ms" rows="5" required style="width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)"></textarea></label><button class="btn" style="padding:13px">${xs('send')}</button></form></div><div class="box" style="align-self:start"><h2>${xs('contact')}</h2><p>✉️ <a href="mailto:${esc(C.email)}">${esc(C.email)}</a></p><p>📱 ${esc(C.phone)}</p><p>💬 <a href="https://wa.me/${esc(C.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a></p><p>📍 ${esc(C.address)}</p><p>🕒 ${esc(C.hours)}</p></div></div>`}
function sendMsg(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent('['+CONFIG.brand+'] '+d.sj)+'&body='+encodeURIComponent(d.ms+'\n\n— '+d.nm+' ('+d.em+')')}
function footerHtml(){const col=(h,ks)=>`<div><b>${h}</b>${ks.map(k=>k==='contact'?`<a onclick="go('contact')">${xs('contact')}</a>`:`<a onclick="go('p:${k}')">${pg(k).t}</a>`).join('')}</div>`;return `<div class="fg">${col(xs('buy'),['buy','protection'])}${col(xs('sell'),['sell','prohibited'])}${col(xs('help'),['faq','contact'])}${col(xs('legal'),['terms','privacy','cookies','legal'])}</div><div class="fb">© ${new Date().getFullYear()} ${esc(CONFIG.brand)} by ${esc(CONFIG.by)} · ${xs('cr')} · ${esc(CONFIG.email)}</div>`}
// ===== PAIEMENTS : mets tes clés dans CONFIG.pay puis branche le code de chaque fournisseur ici =====
const payLive=()=>Object.values(CONFIG.pay).some(Boolean);
const need=(key,name)=>async o=>{if(!key())return true; /* clé absente = paiement simulé */ alert(name+' : branche ici le code du fournisseur (voir README).');return false};
const PAYFN={card:need(()=>CONFIG.pay.stripeKey,'Stripe'),apple:need(()=>CONFIG.pay.stripeKey,'Stripe'),sepa:need(()=>CONFIG.pay.stripeKey,'Stripe'),bizum:need(()=>CONFIG.pay.stripeKey,'Stripe'),paypal:need(()=>CONFIG.pay.paypalClientId,'PayPal'),momo:need(()=>CONFIG.pay.kkiapayKey||CONFIG.pay.fedapayKey||CONFIG.pay.cinetpayKey,'Mobile Money'),cod:async()=>true};
async function startPayment(o){return (PAYFN[o.method]||PAYFN.card)(o)}
const sb=(SUPA_URL&&SUPA_KEY&&window.supabase)?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(s)}}
async function auth(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));S.err="";
 try{
  if(sb){
   if(S.mode==="up"){const {data,error}=await sb.auth.signUp({email:f.em,password:f.pw,options:{data:{name:f.nm}}});if(error)throw error;if(!data.session){S.mode="in";S.err=at("confirm");draw();return}S.user={name:f.nm,email:f.em}}
   else{const {data,error}=await sb.auth.signInWithPassword({email:f.em,password:f.pw});if(error)throw error;const m=data.user.user_metadata||{};S.user={name:m.name||f.em,email:f.em}}
  }else{
   const us=store.get("sw_users")||[],h=await sha(f.pw);
   if(S.mode==="up"){if(us.some(u=>u.em===f.em))throw new Error(at("exists"));us.push({nm:f.nm,em:f.em,h});store.set("sw_users",us);S.user={name:f.nm,email:f.em}}
   else{const u=us.find(u=>u.em===f.em&&u.h===h);if(!u)throw new Error(at("bad"));S.user={name:u.nm,email:u.em}}
  }
  store.set("sw_me",S.user);S.view="shop";
 }catch(e){S.err=e.message}
 draw()}
async function logout(){if(sb)await sb.auth.signOut();S.user=null;store.set("sw_me",null);S.cart=[];S.view="shop";draw()}
function loadArticles(){if(!sb)return;sb.from("articles").select("*").order("id",{ascending:false}).then(({data})=>{if(data){P=data.map(r=>({id:r.id,n:r.name,c:r.category,p:Number(r.price),u:r.used?1:0,e:r.emoji||"🛍️",s:r.seller||"",bg:"#d1fae5"}));draw()}})}
function authView(){const up=S.mode==="up";return `<div class="box auth"><div style="text-align:center">${document.querySelector(".logo svg").outerHTML.replace('width="44" height="44"','width="68" height="68"')}<h1 style="margin:8px 0 4px;font-size:24px">${at("wel")}</h1><p style="color:var(--mut);margin:0 0 14px">${at("wsub")}</p></div><div class="chips" style="justify-content:center"><span class="chip ${up?"on":""}" onclick="S.mode='up';S.err='';draw()">${at("signup")}</span><span class="chip ${up?"":"on"}" onclick="S.mode='in';S.err='';draw()">${at("login")}</span></div><form onsubmit="auth(event)" class="f" style="grid-template-columns:1fr">${up?`<label>${at("nm")}<input name="nm" required></label>`:""}<label>${t("em")}<input name="em" type="email" required></label><label>${at("pw")}<input name="pw" type="password" minlength="6" required></label>${S.err?`<p style="color:#dc2626;margin:0">${esc(S.err)}</p>`:""}<button class="btn" style="padding:13px">${up?at("signup"):at("login")}</button></form>${sb?"":`<p style="color:var(--mut);font-size:12px;text-align:center">${at("demo")}</p>`}</div>`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=e=>{const [,,cur,r]=S.co;const v=e*r;return cur==="XOF"?Math.round(v).toLocaleString("fr-FR")+" FCFA":cur==="USD"?"$"+v.toFixed(2):cur==="GBP"?"£"+v.toFixed(2):"€"+v.toFixed(2)};
const shipE=()=>S.cart.length?(S.ship==="fast"?24:12):0;
const subE=()=>S.cart.reduce((a,i)=>a+i.p.p*i.q,0);
function go(v){S.view=v;draw();scrollTo(0,0)}
function add(id){const p=P.find(x=>x.id===id);const i=S.cart.find(x=>x.p.id===id);i?i.q++:S.cart.push({p,q:1});draw()}
function qty(id,d){const i=S.cart.find(x=>x.p.id===id);i.q+=d;if(i.q<1)S.cart=S.cart.filter(x=>x!==i);draw()}
function setLang(l){S.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";draw()}
function sellOpen(){S.sell=true;draw()}
function sellSave(){const n=document.getElementById("sn").value.trim(),p=parseFloat(document.getElementById("sp").value);if(!n||!(p>0))return;
 const c=document.getElementById("sc").value,u=document.getElementById("su").value==="1"?1:0;const em={Mode:"👗",Tech:"💻",Maison:"🏠",Sport:"⚽",Beauté:"💄"};
 if(sb){sb.from("articles").insert({name:n,category:c,price:p,used:!!u,emoji:em[c],seller:S.user.name}).then(loadArticles)}else P.unshift({id:S.nid++,n,c,p,u,e:em[c],s:S.user.name,bg:"#d1fae5"});S.sell=false;S.view="shop";draw()}
async function place(ev){ev.preventDefault();const f=new FormData(ev.target);const d=Object.fromEntries(f);if(!(await startPayment({method:S.pay,amountEUR:subE()+shipE(),customer:d})))return;
 S.order={id:"SW-"+Math.floor(100000+Math.random()*900000),trk:"TRK-"+Math.random().toString(36).slice(2,10).toUpperCase(),date:new Date().toLocaleString(S.lang),d,items:S.cart.slice(),sub:subE(),shp:shipE(),pay:PAY[S.pay],co:S.co};
 S.cart=[];S.view="receipt";draw();scrollTo(0,0)}
function card(p){return `<div class="card"><div class="pic" style="background:${p.bg}">${p.e}<span class="tag ${p.u?"u":""}">${t(p.u?"used":"new")}</span></div><div class="cb"><small>${t("cat")[p.c]} · ${t("by")} ${esc(p.s)}</small><h3>${esc(p.n)}</h3><div class="pr"><b>${fmt(p.p)}</b><button class="btn" onclick="add(${p.id})">${t("see")}</button></div></div></div>`}
function shop(){const q=S.q.toLowerCase();const L=P.filter(p=>(S.cat==="all"||p.c===S.cat)&&(S.cond==="all"||String(p.u)===S.cond)&&p.n.toLowerCase().includes(q));
 const chip=(on,fn,l)=>`<span class="chip ${on?"on":""}" onclick="${fn}">${l}</span>`;
 return `<div class="hero"><h1>${t("h1")}</h1><p>${t("hp")}</p><div class="trust"><span>🔒 ${t("t1")}</span><span>✅ ${t("t2")}</span><span>🚚 ${t("t3")}</span></div></div>
 <div class="chips">${chip(S.cond==="all","S.cond='all';draw()",t("all"))}${chip(S.cond==="0","S.cond='0';draw()","✨ "+t("new"))}${chip(S.cond==="1","S.cond='1';draw()","♻️ "+t("used"))}</div>
 <div class="chips">${chip(S.cat==="all","S.cat='all';draw()",t("all"))}${CATS.map(c=>chip(S.cat===c,`S.cat='${c}';draw()`,t("cat")[c])).join("")}<span style="margin-inline-start:auto;color:var(--mut);font-size:12px;white-space:nowrap">${L.length} ${t("items")}</span></div>
 <div class="grid">${L.map(card).join("")}</div>`}
function checkout(){const o=S.co;
 return `<button class="btn alt" onclick="go('shop')">${t("back")}</button><div class="two" style="margin-top:12px"><form onsubmit="place(event)">
 <div class="box"><h2>${t("s1")}</h2><div class="f"><label>${t("fn")}<input name="fn" required></label><label>${t("ln")}<input name="ln" required></label><label>${t("em")}<input name="em" type="email" required value="${esc(S.user.email)}"></label><label>${t("ph")}<input name="ph" type="tel" required></label><label class="w">${t("ad")}<input name="ad" required></label><label>${t("ci")}<input name="ci" required></label>
 <label>${t("co")}<select onchange="S.co=CTRY.find(c=>c[0]===this.value);S.pay=S.co[4][0];draw()">${CTRY.map(c=>`<option value="${c[0]}" ${c[0]===o[0]?"selected":""}>${c[1]}</option>`).join("")}</select></label></div></div>
 <div class="box"><h2>${t("s2")}</h2><div class="opt ${S.ship==="fast"?"on":""}" onclick="S.ship='fast';draw()"><span>⚡ ${t("fast")}</span><b>${fmt(24)}</b></div><div class="opt ${S.ship==="std"?"on":""}" onclick="S.ship='std';draw()"><span>📦 ${t("std")}</span><b>${fmt(12)}</b></div></div>
 <div class="box"><h2>${t("s3")}</h2>${payLive()?"":`<p style="color:var(--mut);font-size:12px">${xs("demoPay")}</p>`}${o[4].map(m=>`<div class="opt ${S.pay===m?"on":""}" onclick="S.pay='${m}';draw()"><span>${PAY[m]}</span><span>${S.pay===m?"●":"○"}</span></div>`).join("")}</div>
 <button class="btn" style="width:100%;padding:14px" ${S.cart.length?"":"disabled"}>${t("pay")} ${fmt(subE()+shipE())}</button></form>
 <div class="box" style="align-self:start"><h2>${t("cart")}</h2>${S.cart.map(i=>`<div class="row"><span>${i.p.e} ${esc(i.p.n)} ×${i.q}</span><b>${fmt(i.p.p*i.q)}</b></div>`).join("")}
 <div class="row"><span>${t("sub")}</span><span>${fmt(subE())}</span></div><div class="row"><span>${t("ship")}</span><span>${fmt(shipE())}</span></div><div class="row"><b>${t("tot")}</b><b>${fmt(subE()+shipE())}</b></div></div></div>`}
function receipt(){const r=S.order,f=e=>{const sv=S.co;S.co=r.co;const x=fmt(e);S.co=sv;return x};
 return `<div class="noprint" style="display:flex;justify-content:space-between;margin-bottom:12px"><button class="btn alt" onclick="go('shop')">${t("back")}</button><button class="btn" onclick="print()">🖨️ ${t("print")}</button></div>
 <div class="box" style="padding:24px"><h2 style="font-size:22px">${t("thanks")}</h2><p style="color:var(--ok);font-weight:800">${t("paid")}</p>
 <p>${t("inv")} <b>${r.id}</b> · ${r.date}<br>${esc(r.d.fn)} ${esc(r.d.ln)} · ${esc(r.d.em)}<br>${esc(r.d.ad)}, ${esc(r.d.ci)}, ${r.co[1]}<br>🚚 ${r.trk}</p>
 ${r.items.map(i=>`<div class="row"><span>${i.p.e} ${esc(i.p.n)} ×${i.q}</span><b>${f(i.p.p*i.q)}</b></div>`).join("")}
 <div class="row"><span>${t("ship")}</span><span>${f(r.shp)}</span></div><div class="row"><b>${t("tot")}</b><b>${f(r.sub+r.shp)}</b></div><p style="color:var(--mut);font-size:12px">${r.pay}</p></div>`}
function sheet(){if(S.sell)return `<div class="ov" onclick="if(event.target===this){S.sell=false;draw()}"><div class="sheet"><h2 style="margin-top:0">${t("sellT")}</h2><div class="f"><label class="w">${t("nm")}<input id="sn"></label><label>${t("pc")}<input id="sp" type="number" min="1"></label><label>${t("cd")}<select id="su"><option value="0">${t("new")}</option><option value="1">${t("used")}</option></select></label><label class="w">${t("ct")}<select id="sc">${CATS.map(c=>`<option value="${c}">${t("cat")[c]}</option>`).join("")}</select></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn alt" style="flex:1" onclick="S.sell=false;draw()">${t("cancel")}</button><button class="btn" style="flex:1" onclick="sellSave()">${t("pub")}</button></div></div></div>`;
 if(S.cartOpen)return `<div class="ov" onclick="if(event.target===this){S.cartOpen=false;draw()}"><div class="sheet"><h2 style="margin-top:0">🛒 ${t("cart")}</h2>${S.cart.length?S.cart.map(i=>`<div class="row"><span>${i.p.e} ${esc(i.p.n)}<br><small style="color:var(--mut)">${fmt(i.p.p)}</small></span><span class="q"><button onclick="qty(${i.p.id},-1)">−</button>${i.q}<button onclick="qty(${i.p.id},1)">+</button></span></div>`).join("")+`<div class="row"><b>${t("sub")}</b><b>${fmt(subE())}</b></div><button class="btn" style="width:100%;margin-top:12px;padding:13px" onclick="S.cartOpen=false;go('checkout')">${t("order")}</button>`:`<p style="color:var(--mut)">${t("empty")}</p>`}</div></div>`;return ""}
function draw(){document.getElementById("ann").textContent="🌍 "+t("ann");document.getElementById("q").placeholder=t("search");document.getElementById("sellBtn").textContent=t("sell");
 document.getElementById("cnt").textContent=S.cart.reduce((a,i)=>a+i.q,0);
 document.body.classList.toggle("anon",!S.user);const ub=document.getElementById("userBtn");ub.textContent="⎋ "+at("logout");ub.title=S.user?S.user.name:"";
 const pub=S.view==="contact"||S.view.startsWith("p:");document.getElementById("ft").innerHTML=footerHtml();
 document.getElementById("app").innerHTML=pub?(S.view==="contact"?contactView():pageView(S.view.slice(2))):!S.user?authView():S.view==="shop"?shop():S.view==="checkout"?checkout():receipt();document.getElementById("ov").innerHTML=S.user?sheet():""}
