<head>

<style>
:root{--bg:#fff;--card:#fff;--tx:#191919;--mut:#707070;--pri:#3665f3;--pri2:#3665f3;--bd:#e5e5e5;--ok:#078332;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
.top{background:#f7f7f7;color:#191919;border-bottom:1px solid var(--bd);font-size:12px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top select{background:#fff;color:#191919;border:1px solid #c7c7c7;border-radius:8px;padding:3px 6px}
.top option{color:#222}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo b{font-size:21px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.logo small{font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.search{flex:1;min-width:0}.search input{width:100%;padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.btn{border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.btn.alt{background:#fff;color:var(--pri);border:1px solid var(--pri)}.btn:disabled{opacity:.5;cursor:not-allowed}.pinfo{white-space:pre-wrap;background:#f7f7f7;border:1px dashed #c7c7c7;padding:10px;border-radius:10px;margin:8px 0}
.cartb{position:relative;font-size:18px;padding:8px 12px}
.cartb i{position:absolute;top:-6px;right:-6px;background:#e53238;color:#fff;font-style:normal;font-size:11px;border-radius:99px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.hero{border-radius:22px;padding:28px 22px;color:#191919;background:#f7f7f7;border:1px solid var(--bd);margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.1}.hero p{margin:0 0 14px;opacity:.92;max-width:560px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:130px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff}
.tag.u{background:#f59e0b;color:#222}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cb h3{margin:0;font-size:15px}.cb small{color:var(--mut)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}.pr b{font-size:17px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.box h2{margin:0 0 10px;font-size:17px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;font-weight:600;display:block}.f .w{grid-column:1/-1}
.f input,.f select{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--pri);background:rgba(54,101,243,.08)}
.ov{position:fixed;inset:0;background:rgba(10,0,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.q{display:flex;align-items:center;gap:6px}.q button{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}.search{display:none}.f{grid-template-columns:1fr}}
.anon .noprint,.anon .search,.anon .cartb,.anon #userBtn{display:none}.auth{max-width:420px;margin:24px auto}
a{color:var(--pri);cursor:pointer}.box p{line-height:1.55}
footer{border-top:1px solid var(--bd);background:var(--card);padding:26px 14px;margin-top:20px}.fg{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}.fg div{display:flex;flex-direction:column;gap:8px}.fg a{font-size:13px;color:var(--mut)}.fb{max-width:1100px;margin:18px auto 0;font-size:12px;color:var(--mut)}
.card{cursor:pointer}.pic img{width:100%;height:100%;object-fit:cover}.tag.st{left:auto;right:8px}.tag.cn{top:auto;bottom:8px}.tag.rd{background:#dc2626}.tag.gr{background:#059669}.card.sold .pic{opacity:.55}.f textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:inherit;font:inherit}.phl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.phi{position:relative;width:64px;height:64px}.phi img{width:100%;height:100%;object-fit:cover;border-radius:10px}.phi b{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:99px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{flex:0 0 100%;height:260px;object-fit:cover;border-radius:14px;scroll-snap-align:start}
.proof{max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--bd)}
@media print{.top,header,footer,.noprint{display:none!important}}
.trust{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.95}
</style>

buy:{t:{fr:'Comment acheter',en:'How to buy'},b:{fr:['Parcourez ou recherchez un article, filtrez par état (neuf ou occasion) et ajoutez-le au panier.','À la commande, choisissez votre pays : les moyens de paiement et la devise s’adaptent automatiquement.','Après votre commande, le vendeur vous envoie ses instructions de paiement. Le reçu est disponible dès que le paiement est confirmé.'],en:['Browse or search, filter by condition (new or used) and add items to your cart.','At checkout choose your country: payment methods and currency adapt automatically.','After your order the seller sends payment instructions. The receipt is available once payment is confirmed.']}},
sell:{t:{fr:'Comment vendre',en:'How to sell'},b:{fr:['Créez un compte, appuyez sur « Vendre » puis indiquez le nom, le prix, l’état (neuf ou occasion) et la catégorie.','Décrivez honnêtement l’état de l’article et ajoutez de vraies photos. Les annonces trompeuses sont retirées.','Ajoutez votre adresse de vendeur : elle reste privée et n’apparaît que sur le reçu, après paiement.','À chaque commande vous recevez une notification : envoyez vos instructions de paiement (PayPal, Bizum, Mobile Money, virement…), puis confirmez la réception du paiement.','Expédiez ensuite l’article avec un numéro de suivi.'],en:['Create an account, tap “Sell”, then enter name, price, condition (new or used) and category.','Describe the condition honestly and add real photos. Misleading listings are removed.','Add your seller address: it stays private and appears only on the receipt, after payment.','For each order you get a notification: send your payment instructions (PayPal, Bizum, Mobile Money, transfer…), then confirm you received the payment.','Then ship the item with a tracking number.']}},
protection:{t:{fr:'Protection acheteur et retours',en:'Buyer protection and returns'},b:{fr:['Si l’article n’arrive pas ou diffère fortement de la description, vous êtes remboursé.','Signalez le problème dans les 14 jours après la date de livraison estimée, via la page Contact.','Rétractation : 14 jours pour retourner un article neuf acheté auprès d’un vendeur professionnel, selon la loi applicable. Les frais de retour peuvent être à votre charge.','Les remboursements sont effectués par le moyen de paiement d’origine sous 5 à 10 jours ouvrés après validation.'],en:['If an item does not arrive or differs greatly from its description, you are refunded.','Report the problem within 14 days of the estimated delivery date through the Contact page.','Withdrawal: 14 days to return a new item bought from a professional seller, as the applicable law provides. Return costs may be at your expense.','Refunds go back to the original payment method within 5 to 10 business days after approval.']}},
prohibited:{t:{fr:'Articles interdits',en:'Prohibited items'},b:{fr:['Armes, munitions et explosifs.','Drogues, médicaments sans ordonnance et substances illégales.','Contrefaçons, copies de marques et articles volés.','Produits dangereux, espèces protégées, restes humains.','Contenus pour adultes, haineux ou illégaux ; documents d’identité, cartes bancaires et données personnelles.','Tout article dont la vente est interdite dans le pays du vendeur ou de l’acheteur. Les annonces non conformes sont supprimées et les comptes peuvent être suspendus.'],en:['Weapons, ammunition and explosives.','Drugs, prescription-only medicines and illegal substances.','Counterfeits, brand copies and stolen goods.','Dangerous products, protected species, human remains.','Adult, hateful or illegal content; ID documents, bank cards and personal data.','Anything illegal to sell in the seller’s or buyer’s country. Non-compliant listings are removed and accounts may be suspended.']}},
terms:{t:{fr:'Conditions d’utilisation',en:'Terms of use'},b:{fr:['Ces conditions régissent l’utilisation de {brand}, exploité par {company}. En créant un compte, vous les acceptez.','Compte : vous devez avoir 18 ans ou plus, fournir des informations exactes et protéger votre mot de passe.','{brand} est une place de marché : les ventes se font entre vendeurs et acheteurs ; nous facilitons la mise en relation, le paiement et le suivi.','Sont interdits : la fraude, les fausses annonces, la manipulation des avis, le contournement des paiements et tout usage illégal.','Nous pouvons suspendre un compte ou retirer une annonce qui enfreint ces règles. Notre responsabilité est limitée dans la mesure permise par la loi.','Droit applicable et tribunaux compétents : [à compléter]. Dernière mise à jour : [date].'],en:['These terms govern the use of {brand}, operated by {company}. By creating an account you accept them.','Account: you must be 18 or older, give accurate information and protect your password.','{brand} is a marketplace: sales are between sellers and buyers; we facilitate matching, payment and tracking.','Prohibited: fraud, fake listings, review manipulation, bypassing payments and any illegal use.','We may suspend an account or remove a listing that breaks these rules. Our liability is limited as far as the law allows.','Governing law and courts: [to complete]. Last updated: [date].']}},
privacy:{t:{fr:'Politique de confidentialité',en:'Privacy policy'},b:{fr:['Données collectées : nom, email, téléphone, adresse de livraison, historique de commandes et d’annonces.','Utilisation : gérer votre compte, vos commandes, la livraison, le paiement, la prévention de la fraude et le support.','Partage : avec les vendeurs, transporteurs et prestataires de paiement nécessaires à la commande. Nous ne vendons pas vos données.','Vos droits : accès, correction et suppression de vos données sur demande à {email}.','Conservation : pendant la durée du compte et les délais légaux. Connexion chiffrée (HTTPS).'],en:['Data collected: name, email, phone, delivery address, order and listing history.','Use: manage your account, orders, delivery, payment, fraud prevention and support.','Sharing: with sellers, carriers and payment providers needed for your order. We do not sell your data.','Your rights: access, correct and delete your data by writing to {email}.','Retention: for the life of the account and legal periods. Encrypted connection (HTTPS).']}},
cookies:{t:{fr:'Cookies',en:'Cookies'},b:{fr:['Cookies essentiels : connexion et panier, indispensables au fonctionnement du site.','Mesure d’audience ou publicité : uniquement avec votre consentement [à activer si tu ajoutes des outils comme Google Analytics].','Vous pouvez effacer ou bloquer les cookies dans les réglages de votre navigateur.'],en:['Essential cookies: login and cart, required for the site to work.','Analytics or advertising: only with your consent [enable if you add tools such as Google Analytics].','You can clear or block cookies in your browser settings.']}},
legal:{t:{fr:'Mentions légales',en:'Legal notice'},b:{fr:['Éditeur : {company} — {rccm}','Adresse : {address} · Email : {email} · Téléphone : {phone}','Directeur de publication : [nom]. Hébergeur : [Netlify / Vercel / autre].'],en:['Publisher: {company} — {rccm}','Address: {address} · Email: {email} · Phone: {phone}','Publication director: [name]. Host: [Netlify / Vercel / other].']}},
faq:{t:{fr:'Centre d’aide',en:'Help center'},b:{fr:['Où est ma commande ? Utilisez le numéro de suivi de votre facture ou écrivez-nous via Contact.','Comment être remboursé ? Voir « Protection acheteur et retours ».','Mot de passe oublié ? [à activer avec Supabase : Authentication > Email templates].','Un vendeur ne répond pas ou un article est suspect ? Signalez-le via Contact (objet « Signaler »).'],en:['Where is my order? Use the tracking number on your invoice or write to us via Contact.','How do I get a refund? See “Buyer protection and returns”.','Forgot your password? [enable with Supabase: Authentication > Email templates].','A seller does not answer or an item looks suspicious? Report it via Contact (subject “Report”).']}}};
const pg=k=>({t:PG[k].t[S.lang]||PG[k].t.en,b:PG[k].b[S.lang]||PG[k].b.en});
const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>esc(k==='fee'?CONFIG.feePercent:(CONFIG[k]??m)));
function pageView(k){const p=pg(k);return `<button class="btn alt" onclick="go('shop')">${t('back')}</button><div class="box" style="margin-top:12px"><h2>${p.t}</h2>${p.b.map(s=>`<p>${fill(s)}</p>`).join('')}</div>`}
function contactView(){const C=CONFIG,u=S.user;return `<button class="btn alt" onclick="go('shop')">${t('back')}</button><div class="two" style="margin-top:12px"><div class="box"><h2>${xs('cT')}</h2><p style="color:var(--mut)">${xs('cS')}</p><form onsubmit="sendMsg(event)" class="f" style="grid-template-columns:1fr"><label>${at('nm')}<input name="nm" required value="${esc(u?u.name:'')}"></label><label>${t('em')}<input name="em" type="email" required value="${esc(u?u.email:'')}"></label><label>${xs('subjL')}<select name="sj">${xs('subj').map(s=>`<option>${s}</option>`).join('')}</select></label><label>${xs('msg')}<textarea name="ms" rows="5" required style="width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)"></textarea></label><button class="btn" style="padding:13px">${xs('send')}</button></form></div><div class="box" style="align-self:start"><h2>${xs('contact')}</h2><p>✉️ <a href="mailto:${esc(C.email)}">${esc(C.email)}</a></p><p>📱 ${esc(C.phone)}</p><p>💬 <a href="https://wa.me/${esc(C.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a></p><p>📍 ${esc(C.address)}</p><p>🕒 ${esc(C.hours)}</p><p>📦 ${xs('shipC')} : <a href="mailto:${esc(C.shipEmail)}">${esc(C.shipEmail)}</a></p></div></div>`}
function sendMsg(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent('['+CONFIG.brand+'] '+d.sj)+'&body='+encodeURIComponent(d.ms+'\n\n— '+d.nm+' ('+d.em+')')}
function footerHtml(){const col=(h,ks)=>`<div><b>${h}</b>${ks.map(k=>k==='contact'?`<a onclick="go('contact')">${xs('contact')}</a>`:`<a onclick="go('p:${k}')">${pg(k).t}</a>`).join('')}</div>`;return `<div class="fg">${col(xs('buy'),['buy','protection'])}${col(xs('sell'),['sell','prohibited'])}${col(xs('help'),['faq','contact'])}${col(xs('legal'),['terms','privacy','cookies','legal'])}</div><div class="fb">© ${new Date().getFullYear()} ${esc(CONFIG.brand)} · ${xs('cr')} · ${esc(CONFIG.email)}</div>`}
// ===== PAIEMENTS : mets tes clés dans CONFIG.pay puis branche le code de chaque fournisseur ici =====
const payLive=()=>Object.values(CONFIG.pay).some(Boolean);
const need=(key,name)=>async o=>{if(!key())return true; /* clé absente = paiement simulé */ alert(name+' : branche ici le code du fournisseur (voir README).');return false};
const PAYFN={card:need(()=>CONFIG.pay.stripeKey,'Stripe'),apple:need(()=>CONFIG.pay.stripeKey,'Stripe'),sepa:need(()=>CONFIG.pay.stripeKey,'Stripe'),bizum:need(()=>CONFIG.pay.stripeKey,'Stripe'),paypal:need(()=>CONFIG.pay.paypalClientId,'PayPal'),momo:need(()=>CONFIG.pay.kkiapayKey||CONFIG.pay.fedapayKey||CONFIG.pay.cinetpayKey,'Mobile Money'),cod:async()=>true};
async function startPayment(o){return (PAYFN[o.method]||PAYFN.card)(o)}
const sb=(SUPA_URL&&SUPA_KEY)?mkSb(SUPA_URL,SUPA_KEY):null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(s)}}
async function auth(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));S.err="";
 try{
  if(sb){
   if(S.mode==="up"){const {data,error}=await sb.auth.signUp({email:f.em,password:f.pw,options:{data:{name:f.nm}}});if(error)throw error;if(!data.session){S.mode="in";S.err=at("confirm");draw();return}S.user={name:f.nm,email:f.em}}
   else{const {data,error}=await sb.auth.signInWithPassword({email:f.em,password:f.pw});if(error)throw error;const m=data.user.user_metadata||{};S.user={name:m.name||f.em,email:f.em}}
  }else{
   const us=store.get("sw_users")||[],h=await sha(f.pw);
   if(S.mode==="up"){if(us.some(u=>u.em===f.em))throw new Error(at("exists"));us.push({nm:f.nm,em:f.em,h});store.set("sw_users",us);S.user={name:f.nm,email:f.em}}
   else{const u=us.find(u=>u.em===f.em&&u.h===h);if(!u)throw new Error(at("bad"));S.user={name:u.nm,email:u.em}}
  }
  store.set("sw_me",S.user);S.view="shop";
 }catch(e){S.err=e.message}
 draw()}

   eq(c,v){q.f.push(c+'=eq.'+encodeURIComponent(v));return a},order(c,o){q.o=c+'.'+((o&&o.ascending===false)?'desc':'asc');return a},maybeSingle(){q.one=true;return a},
   then(res,rej){return run().then(res,rej)}};
  async function run(){const tk=await ensure();const p=q.f.slice();if(q.m==='GET'){p.push('select='+(q.sel||'*'));if(q.o)p.push('order='+q.o);if(q.one)p.push('limit=1')}
   const pre=[q.pr,q.m==='GET'?'':'return=minimal'].filter(Boolean).join(',');
   const r=await call('/rest/v1/'+tb+'?'+p.join('&'),{method:q.m,headers:H(tk,pre?{Prefer:pre}:{}),body:q.b?JSON.stringify(q.b):undefined});
   if(!r.ok)return{data:null,error:err(r.j)};
   return{data:q.m==='GET'?(q.one?((r.j&&r.j[0])||null):(r.j||[])):null,error:null}}
  return a}
 const storage={from(b){return{
  async upload(path,blob,o){const tk=await ensure();const r=await call('/storage/v1/object/'+b+'/'+path,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+(tk||key),'Content-Type':(o&&o.contentType)||blob.type,'x-upsert':'true'},body:blob});return{error:r.ok?null:err(r.j)}},
  getPublicUrl(path){return{data:{publicUrl:url+'/storage/v1/object/public/'+b+'/'+path}}},
  async remove(paths){const tk=await ensure();const r=await call('/storage/v1/object/'+b,{method:'DELETE',headers:H(tk),body:JSON.stringify({prefixes:paths})});return{error:r.ok?null:err(r.j)}}}}};
 return{auth,from,storage}}
// ===== Profil vendeur (adresse, code postal, ville, pays, téléphone) =====
const pf=()=>Object.assign({street:'',postal:'',city:'',country:'',phone:''},S.prof||(!sb&&S.user?store.get('sw_prof_'+S.user.email):null)||{});
async function saveProf(o){S.prof=o;if(sb){const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('profiles').upsert(Object.assign({user_id:user.id},o));if(error)throw error}else store.set('sw_prof_'+S.user.email,o)}
async function loadProf(){if(!sb||!S.user)return;const {data}=await sb.from('profiles').select('*').maybeSingle();if(data)S.prof={street:data.street||'',postal:data.postal||'',city:data.city||'',country:data.country||'',phone:data.phone||''}}
// ===== Articles =====
function loadArticles(){if(!sb)return;sb.from('articles').select('*').order('id',{ascending:false}).then(({data,error})=>{S.dbErr=error?error.message:'';if(data)P=data.map(r=>({id:r.id,n:r.name,c:r.category,p:Number(r.price),u:r.used?1:0,e:r.emoji||'🛍️',s:r.seller||'',d:r.description||'',ph:r.photos||[],st:r.status||'en_cours',uid:r.user_id,loc:r.loc||'',bg:'#d1fae5'}));draw()})}
const dbBanner=()=>!sb?`<div class="box" style="background:#fff8e1;border-color:#f5af02">⚠️ ${xs('demoDb')}</div>`:(S.dbErr?`<div class="box" style="background:#fdecea;border-color:#e53238">⚠️ ${esc(S.dbErr)}</div>`:'');
async function shrink(f,mx,q){mx=mx||1000;q=q||.8;let b;try{b=await createImageBitmap(f)}catch(e){b=await new Promise((ok,ko)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>ok(im);im.onerror=()=>ko(new Error('format'));im.src=u})}
 const k=Math.min(1,mx/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function addPh(inp){const fs=[...inp.files],bad=[];for(const f of fs){if(PH.length>=20){alert(xs('max20'));break}try{PH.push(await shrink(f))}catch(e){bad.push(f.name||'?')}}inp.value='';phRender();if(bad.length)alert(xs('badPh')+' '+bad.join(', '))}
async function sellSave(){const g=i=>document.getElementById(i).value.trim();const n=g('sn'),p=parseFloat(g('sp'));if(!n||!(p>0))return;
 const pr={street:g('sa'),postal:g('sz'),city:g('sy'),country:g('sk'),phone:g('sph')};if(Object.values(pr).some(v=>!v)){alert(xs('needAddr'));return}
 const c=g('sc'),u=g('su')==='1'?1:0,d=g('sd'),loc=pr.postal+' '+pr.city+', '+pr.country;
 const em={Mode:'👗',Tech:'💻',Maison:'🏠',Sport:'⚽',Beauté:'💄'};const bt=document.getElementById('pub');bt.disabled=true;bt.textContent='…';
 try{await saveProf(pr);
  if(sb){const {data:{user}}=await sb.auth.getUser();const urls=[];
   for(let i=0;i<PH.length;i++){const path=user.id+'/'+Date.now()+'-'+i+'.jpg';const {error}=await sb.storage.from('photos').upload(path,d2b(PH[i]),{contentType:'image/jpeg'});if(error)throw error;urls.push(sb.storage.from('photos').getPublicUrl(path).data.publicUrl)}
   const {error}=await sb.from('articles').insert({name:n,category:c,price:p,used:!!u,emoji:em[c],seller:S.user.name,description:d,photos:urls,status:'en_cours',loc});if(error)throw error;loadArticles()
  }else P.unshift({id:S.nid++,n,c,p,u,e:em[c],s:S.user.name,own:S.user.email,d,ph:PH.slice(),st:'en_cours',loc,bg:'#d1fae5'});
  PH=[];S.sell=false;S.view='shop';draw()
 }catch(e){bt.disabled=false;bt.textContent=t('pub');alert(e.message||e)}}
// ===== Commandes =====
async function sendInfo(id){const v=document.getElementById('pi'+id).value.trim();if(!v)return;const p=pf();if(!p.street||!p.phone){alert(xs('needAddr'));return}
 await updOrd(id,{pay_info:v,status:'attente_paiement',seller_address:p.street+', '+p.postal+' '+p.city+', '+p.country,seller_phone:p.phone,seller_email:S.user.email})}
async function sendProof(id){const f=document.getElementById('pf'+id).files[0];if(!f){alert(xs('needProof'));return}try{const d=await shrink(f,1400,.75);await updOrd(id,{proof:d,status:'paye_declare'})}catch(e){alert(xs('badPh')+' '+f.name)}}
function orderCard(o){const sl=S.otab==='sell',st=o.status;let s='',a='';
 const info=`<div class="pinfo">${esc(o.pay_info||'')}</div>`,sc=`<p style="margin:4px 0">📍 ${esc(o.seller_address||'')}<br>📞 ${esc(o.seller_phone||'')} · ✉️ ${esc(o.seller_email||'')}</p>`;
 if(st==='attente_vendeur'){if(sl){s=xs('stWaitS');a=`<label>${xs('payInfoL')}<textarea id="pi${o.id}" rows="3"></textarea></label><button class="btn" style="margin-top:8px" onclick="sendInfo(${o.id})">${xs('sendInfo')}</button>`}else s=xs('stWait')}
 else if(st==='attente_paiement'){if(sl)s=xs('stWaitPay');else{s=xs('stPay');a=info+sc+`<label>${xs('proofL')}<input type="file" id="pf${o.id}" accept="image/*"></label><button class="btn" style="margin-top:8px" onclick="sendProof(${o.id})">${xs('sendProof')}</button>`}}
 else if(st==='paye_declare'){if(sl){s=xs('stDecl');a=`<img class="proof" src="${esc(o.proof||'')}" alt=""><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="setOrd(${o.id},'paye')">${xs('gotPay')}</button><button class="btn alt" onclick="updOrd(${o.id},{status:'attente_paiement',proof:null})">${xs('badProof')}</button></div>`}else{s=xs('stDeclB');a=`<button class="btn" onclick="openRc(${o.id})">🧾 ${xs('receiptP')}</button>`}}
 else if(st==='paye'){s=xs('stPaid');a=`<button class="btn" onclick="openRc(${o.id})">🧾 ${xs('receipt')}</button>`}
 else s=xs('stCancel');
 const can=(st==='attente_vendeur'||st==='attente_paiement')?`<button class="btn alt" style="margin-top:8px" onclick="cancelOrd(${o.id})">${xs('cancelO')}</button>`:'';
 const who=sl?`${xs('buyer')} : ${esc(o.buyer_name)}`:`${xs('seller')} : ${esc(o.seller_name)}`,adr=sl&&st!=='annule'?`<p style="margin:4px 0">📍 ${esc(o.buyer_address)} · 📞 ${esc(o.buyer_phone)}</p>`:'';
 return `<div class="box"><div class="row" style="border:0;padding:0"><b>${esc(o.article_name)}</b><b>${esc(o.total_txt)}</b></div><small style="color:var(--mut)">#${o.id} · ${who} · ${esc(PAY[o.method]||o.method)}</small>${adr}<p style="font-weight:700;margin:8px 0">${s}</p>${a}<div>${can}</div></div>`}
// ===== Fiche article + lien à partager =====
function shareArt(id){const u=location.origin+location.pathname+'#a-'+id;if(navigator.share){navigator.share({title:CONFIG.brand,url:u}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>alert(xs('copied')+'\n'+u))}else prompt('',u)}
function detView(){const p=P.find(x=>x.id===S.det);if(!p){S.det=null;return ''}const sold=p.st==='vendu',h=p.ph&&p.ph.length,m=mine(p);
 return `<div class="ov" onclick="if(event.target===this){S.det=null;draw()}"><div class="sheet"><div class="gal">${h?p.ph.map(u=>`<img src="${esc(u)}" alt="">`).join(''):`<div class="pic" style="background:${p.bg};flex:0 0 100%;height:200px;border-radius:14px">${p.e}</div>`}</div>${h>1?`<small style="color:var(--mut)">📷 ${p.ph.length} · ← →</small>`:''}<h2 style="margin:10px 0 2px">${esc(p.n)}</h2><b style="font-size:20px">${fmt(p.p)}</b> <span class="tag st ${sold?'rd':'gr'}" style="position:static">${xs(sold?'sold':'ongoing')}</span> <span class="tag ${p.u?'u':''}" style="position:static">${t(p.u?'used':'new')}</span><p style="color:var(--mut);margin:8px 0">${t('cat')[p.c]} · ${t('by')} ${esc(p.s)}${p.loc?`<br>📍 ${esc(p.loc)}`:''}</p><p style="white-space:pre-wrap">${p.d?esc(p.d):`<i style="color:var(--mut)">${xs('nodesc')}</i>`}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${sold?'':`<button class="btn" style="flex:1" onclick="S.det=null;add(${p.id})">${t('see')}</button>`}<button class="btn alt" style="flex:1" onclick="shareArt(${p.id})">🔗 ${xs('share')}</button>${m?`<button class="btn alt" style="flex:1" onclick="S.det=null;setSt(${p.id},${sold?0:1})">${sold?xs('relist'):xs('markSold')}</button><button class="btn alt" style="flex:1;color:#dc2626" onclick="delArt(${p.id})">🗑 ${xs('del')}</button>`:''}</div><p style="margin-top:12px"><a href="mailto:${esc(CONFIG.email)}?subject=${encodeURIComponent('Signalement #'+p.id)}">🚩 ${xs('report')}</a></p></div></div>`}
// ===== Langue et devise automatiques selon le pays du visiteur =====
const L2C={FR:'fr',BE:'fr',BJ:'fr',CI:'fr',SN:'fr',TG:'fr',CM:'fr',ES:'es',MX:'es',AR:'es',CO:'es',CL:'es',PE:'es',IT:'it',DE:'de',AT:'de',CH:'de',PT:'pt',BR:'pt',AO:'pt'},DEF={fr:'FR',es:'ES',it:'IT',de:'DE',pt:'ES',en:'GB'};
function applyCC(cc){const l=L2C[cc]||'en';S.co=CTRY.find(c=>c[0]===cc)||CTRY.find(c=>c[0]===DEF[l]);S.pay=S.co[4][0];setLang(l)}
async function detectLoc(){const pr=store.get('sw_pref');if(pr&&pr.lang){S.co=CTRY.find(c=>c[0]===pr.cc)||S.co;S.pay=S.co[4][0];setLang(pr.lang);return}
 let cc='';try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),4000);const r=await fetch('https://ipwho.is/',{signal:ac.signal});clearTimeout(tm);const j=await r.json();if(j&&j.success!==false)cc=j.country_code||''}catch(e){}
 if(!cc)cc=((navigator.language||'').split('-')[1]||'').toUpperCase();
 if(cc)applyCC(cc);else{const l=(navigator.language||'fr').slice(0,2);setLang(T[l]?l:'en')}}

const ls=document.getElementById("lang");ls.innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");ls.onchange=()=>{setLang(ls.value);store.set('sw_pref',{lang:S.lang,cc:S.co[0]})};
const cy0=document.getElementById('cty');cy0.innerHTML=CTRY.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');cy0.onchange=()=>{S.co=CTRY.find(c=>c[0]===cy0.value);S.pay=S.co[4][0];store.set('sw_pref',{lang:S.lang,cc:S.co[0]});draw()};
S.pay=S.co[4][0];S.user=store.get("sw_me");draw();const hm=location.hash.match(/^#a-(\d+)/);if(hm)S.want=+hm[1];detectLoc();
if(sb){sb.auth.onAuthStateChange((ev,se)=>{const id=se&&se.user?se.user.id:null;if(id!==S.uid){S.uid=id;draw();setTimeout(()=>{loadProf();loadOrders()},0)}});setInterval(loadOrders,20000);sb.auth.getSession().then(({data})=>{const u=data.session&&data.session.user;S.user=u?{name:(u.user_metadata&&u.user_metadata.name)||u.email,email:u.email}:null;draw();loadArticles()})}
