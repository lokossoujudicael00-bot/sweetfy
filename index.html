<style>
:root{--bg:#fff;--card:#fff;--tx:#191919;--mut:#707070;--pri:#3665f3;--pri2:#3665f3;--bd:#e5e5e5;--ok:#078332;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
.top{background:#f7f7f7;color:#191919;border-bottom:1px solid var(--bd);font-size:12px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top select{background:#fff;color:#191919;border:1px solid #c7c7c7;border-radius:8px;padding:3px 6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.logo b{font-size:21px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.search{flex:1;min-width:0}.search input{width:100%;padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.btn{border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.btn.alt{background:#fff;color:var(--pri);border:1px solid var(--pri)}.btn:disabled{opacity:.5;cursor:not-allowed}
.pinfo{white-space:pre-wrap;background:#f7f7f7;border:1px dashed #c7c7c7;padding:10px;border-radius:10px;margin:8px 0}
.cartb{position:relative;font-size:18px;padding:8px 12px}
.cartb i{position:absolute;top:-6px;right:-6px;background:#e53238;color:#fff;font-style:normal;font-size:11px;border-radius:99px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.hero{border-radius:22px;padding:28px 22px;color:#191919;background:#f7f7f7;border:1px solid var(--bd);margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.1}.hero p{margin:0 0 14px;opacity:.92;max-width:560px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pic{height:130px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff}
.tag.u{background:#f59e0b;color:#222}
.tag.st{left:auto;right:8px}.tag.cn{top:auto;bottom:8px}.tag.rd{background:#dc2626}.tag.gr{background:#059669}
.card.sold .pic{opacity:.55}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cb h3{margin:0;font-size:15px}.cb small{color:var(--mut)}
.loc-tag{font-size:11px;color:#3665f3;font-weight:600;display:flex;align-items:center;gap:3px;margin-top:2px}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}.pr b{font-size:17px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.box h2{margin:0 0 10px;font-size:17px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;font-weight:600;display:block}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--pri);background:rgba(54,101,243,.08)}
.ov{position:fixed;inset:0;background:rgba(10,0,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.q{display:flex;align-items:center;gap:6px}.q button{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}.search{display:none}.f{grid-template-columns:1fr}}
.anon .noprint,.anon .search,.anon .cartb,.anon #userBtn{display:none}.auth{max-width:420px;margin:24px auto}
a{color:var(--pri);cursor:pointer}.box p{line-height:1.55}
footer{border-top:1px solid var(--bd);background:var(--card);padding:26px 14px;margin-top:20px}.fg{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}.fg div{display:flex;flex-direction:column;gap:8px}.fg a{font-size:13px;color:var(--mut)}.fb{max-width:1100px;margin:18px auto 0;font-size:12px;color:var(--mut)}
.phl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.phi{position:relative;width:64px;height:64px}.phi img{width:100%;height:100%;object-fit:cover;border-radius:10px}.phi b{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:99px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{flex:0 0 100%;height:260px;object-fit:cover;border-radius:14px;scroll-snap-align:start}
@media print{.top,header,footer,.noprint{display:none!important}}
.trust{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.95}
</style>

      if(error)throw error;
      loadArticles();
    }else{
      P.unshift({id:S.nid++,n,c,p,u,e:em[c],s:S.user.name,own:S.user.email,addr:ad,cc:countryCode,d,ph:PH.slice(),st:'en_cours',bg:'#d1fae5'});
    }
    PH=[];S.sell=false;S.view='shop';draw();
  }catch(e){bt.disabled=false;bt.textContent=t('pub');alert(e.message||e)}
}

async function setSt(id,v){
  const p=P.find(x=>x.id===id);if(!p)return;const st=v?'vendu':'en_cours';
  if(sb){const {error}=await sb.from('articles').update({status:st}).eq('id',id);if(error){alert(error.message);return}loadArticles()}
  else{p.st=st;draw()}
}
async function delArt(id){
  if(!confirm(xs('delQ')))return;
  const p=P.find(x=>x.id===id);
  if(sb){
    const paths=((p&&p.ph)||[]).map(u=>u.split('/photos/')[1]).filter(Boolean);
    if(paths.length)await sb.storage.from('photos').remove(paths);
    const {error}=await sb.from('articles').delete().eq('id',id);
    if(error){alert(error.message);return}
    S.det=null;loadArticles();
  }else{
    P=P.filter(x=>x.id!==id);S.det=null;draw();
  }
}

function copyItemLink(id){
  const url=window.location.origin+window.location.pathname+'?item='+id;
  navigator.clipboard.writeText(url).then(()=>{alert(xs('linkCopied'))});
}

function card(p){
  const sold=p.st==='vendu',h=p.ph&&p.ph.length;
  return `<div class="card ${sold?'sold':''}" onclick="S.det=${p.id};draw()">
    <div class="pic" style="background:${p.bg}">${h?<img src="${esc(p.ph[0])}" alt="">:p.e}<span class="tag ${p.u?'u':''}">${t(p.u?'used':'new')}</span><span class="tag st ${sold?'rd':'gr'}">${xs(sold?'sold':'ongoing')}</span>${h>1?<span class="tag cn">📷 ${p.ph.length}</span>:''}</div>
    <div class="cb">
      <small>${t('cat')[p.c]} · ${t('by')} ${esc(p.s)}</small>
      <h3>${esc(p.n)}</h3>
      <div class="loc-tag">📍 ${esc(p.addr||'Localisation non spécifiée')}</div>
      <div class="pr"><b>${fmt(p.p)}</b><button class="btn" ${sold?'disabled':''} onclick="event.stopPropagation();add(${p.id})">${t('see')}</button></div>
    </div>
  </div>`;
}

function detView(){
  const p=P.find(x=>x.id===S.det);if(!p){S.det=null;return ''}
  const sold=p.st==='vendu',h=p.ph&&p.ph.length,m=mine(p);
  return `<div class="ov" onclick="if(event.target===this){S.det=null;draw()}"><div class="sheet">
    <div class="gal">${h?p.ph.map(u=><img src="${esc(u)}" alt="">).join(''):<div class="pic" style="background:${p.bg};flex:0 0 100%;height:200px;border-radius:14px">${p.e}</div>}</div>
    ${h>1?<small style="color:var(--mut)">📷 ${p.ph.length} · ← →</small>:''}
    <h2 style="margin:10px 0 2px">${esc(p.n)}</h2>
    <b style="font-size:20px">${fmt(p.p)}</b> <span class="tag st ${sold?'rd':'gr'}" style="position:static">${xs(sold?'sold':'ongoing')}</span> <span class="tag ${p.u?'u':''}" style="position:static">${t(p.u?'used':'new')}</span>
    <p style="color:var(--mut);margin:6px 0 2px">${t('cat')[p.c]} · ${t('by')} ${esc(p.s)}</p>
    <p style="color:var(--pri);font-weight:600;margin:0 0 10px;font-size:13px">📍 ${xs('loc')} : ${esc(p.addr||'Non disponible')}</p>
    <p style="white-space:pre-wrap">${p.d?esc(p.d):<i style="color:var(--mut)">${xs('nodesc')}</i>}</p>
    <button class="btn alt" style="width:100%;margin-bottom:8px" onclick="copyItemLink(${p.id})">${xs('copyLink')}</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${sold?'':<button class="btn" style="flex:1" onclick="S.det=null;add(${p.id})">${t('see')}</button>}${m?<button class="btn alt" style="flex:1" onclick="S.det=null;setSt(${p.id},${sold?0:1})">${sold?xs('relist'):xs('markSold')}</button><button class="btn alt" style="flex:1;color:#dc2626" onclick="delArt(${p.id})">🗑️ ${xs('del')}</button>:''}</div>
  </div></div>`;
}

function shop(){
  const q=S.q.toLowerCase();
  const currentCountryCode = S.co[0];
  
  // Filtrage intelligent : priorise/filtre par le pays de l'utilisateur si demandé
  const L=P.filter(p=>{
    const matchCat = (S.cat==="all"||p.c===S.cat);
    const matchCond = (S.cond==="all"||String(p.u)===S.cond);
    const matchQuery = p.n.toLowerCase().includes(q);
    const matchCountry = S.geoFilter==="all" || (p.cc === currentCountryCode || p.cc === "ALL");
    return matchCat && matchCond && matchQuery && matchCountry;
  });

  const chip=(on,fn,l)=><span class="chip ${on?"on":""}" onclick="${fn}">${l}</span>;
  return `<div class="hero"><h1>${t("h1")}</h1><p>${t("hp")}</p><div class="trust"><span>🔒 ${t("t1")}</span><span>✅ ${t("t2")}</span><span>🚚 ${t("t3")}</span></div></div>
  <div class="chips">
    ${chip(S.geoFilter==="myCountry", "S.geoFilter='myCountry';draw()", "📍 "+xs('filterCountry')+" ("+S.co[1]+")")}
    ${chip(S.geoFilter==="all", "S.geoFilter='all';draw()", "🌍 "+xs('filterAll'))}
  </div>
  <div class="chips">${chip(S.cond==="all","S.cond='all';draw()",t("all"))}${chip(S.cond==="0","S.cond='0';draw()","✨ "+t("new"))}${chip(S.cond==="1","S.cond='1';draw()","♻️ "+t("used"))}</div>
  <div class="chips">${chip(S.cat==="all","S.cat='all';draw()",t("all"))}${CATS.map(c=>chip(S.cat===c,S.cat='${c}';draw(),t("cat")[c])).join("")}<span style="margin-inline-start:auto;color:var(--mut);font-size:12px;white-space:nowrap">${L.length} ${t("items")}</span></div>
  <div class="grid">${L.map(card).join("")}</div>`;
}

function checkout(){
  const o=S.co;
  return `<button class="btn alt" onclick="go('shop')">${t("back")}</button><div class="two" style="margin-top:12px"><form onsubmit="place(event)">
  <div class="box"><h2>${t("s1")}</h2><div class="f"><label>${t("fn")}<input name="fn" required></label><label>${t("ln")}<input name="ln" required></label><label>${t("em")}<input name="em" type="email" required value="${esc(S.user?S.user.email:'')}"></label><label>${t("ph")}<input name="ph" type="tel" required></label><label class="w">${t("ad")}<input name="ad" required></label><label>${t("ci")}<input name="ci" required></label>
  <label>${t("co")}<select onchange="S.co=CTRY.find(c=>c[0]===this.value);S.pay=S.co[4][0];draw()">${CTRY.map(c=><option value="${c[0]}" ${c[0]===o[0]?"selected":""}>${c[1]}</option>).join("")}</select></label></div></div>
  <div class="box"><h2>${t("s2")}</h2><div class="opt ${S.ship==="fast"?"on":""}" onclick="S.ship='fast';draw()"><span>⚡ ${t("fast")}</span><b>${fmt(24)}</b></div><div class="opt ${S.ship==="std"?"on":""}" onclick="S.ship='std';draw()"><span>📦 ${t("std")}</span><b>${fmt(12)}</b></div></div>
  <div class="box"><h2>${t("s3")}</h2><p style="color:var(--mut);font-size:12px">${xs('howPay')}</p>${o[4].map(m=><div class="opt ${S.pay===m?"on":""}" onclick="S.pay='${m}';draw()"><span>${PAY[m]}</span><span>${S.pay===m?"●":"○"}</span></div>).join("")}</div>
  <button class="btn" style="width:100%;padding:14px" ${S.cart.length?"":"disabled"}>${xs('sendOrder')} · ${fmt(subE()+shipE())}</button></form>
  <div class="box" style="align-self:start"><h2>${t("cart")}</h2>${S.cart.map(i=><div class="row"><span>${i.p.e} ${esc(i.p.n)} ×${i.q}</span><b>${fmt(i.p.p*i.q)}</b></div>).join("")}
  <div class="row"><span>${t("sub")}</span><span>${fmt(subE())}</span></div><div class="row"><span>${t("ship")}</span><span>${fmt(shipE())}</span></div><div class="row"><b>${t("tot")}</b><b>${fmt(subE()+shipE())}</b></div></div></div>`;
}

function sheet(){
  if(S.menu)return menuHtml();
  if(S.det!=null){const dv=detView();if(dv)return dv}
  if(S.sell)return <div class="ov" onclick="if(event.target===this){S.sell=false;draw()}"><div class="sheet"><h2 style="margin-top:0">${t("sellT")}</h2><div class="f"><label class="w">${t("nm")}<input id="sn"></label><label>${t("pc")}<input id="sp" type="number" min="1"></label><label>${t("cd")}<select id="su"><option value="0">${t("new")}</option><option value="1">${t("used")}</option></select></label><label class="w">${t("ct")}<select id="sc">${CATS.map(c=><option value="${c}">${t("cat")[c]}</option>).join("")}</select></label><label class="w">${xs('addr')} *<input id="sa" value="${esc(curAddr())}" placeholder="ex: Paris, France / Cotonou, Bénin"></label><label class="w">${xs('desc')}<textarea id="sd" rows="4" maxlength="2000"></textarea></label><div class="w"><label>${xs('photos')} (<span id="pcnt">0</span>/20)</label><input id="sf" type="file" accept="image/*" multiple onchange="addPh(this)"><div id="phl" class="phl"></div></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn alt" style="flex:1" onclick="S.sell=false;draw()">${t("cancel")}</button><button class="btn" id="pub" style="flex:1" onclick="sellSave()">${t("pub")}</button></div></div></div>;
  if(S.cartOpen)return <div class="ov" onclick="if(event.target===this){S.cartOpen=false;draw()}"><div class="sheet"><h2 style="margin-top:0">🛒 ${t("cart")}</h2>${S.cart.length?S.cart.map(i=><div class="row"><span>${i.p.e} ${esc(i.p.n)}<br><small style="color:var(--mut)">${fmt(i.p.p)}</small></span><span class="q"><button onclick="qty(${i.p.id},-1)">−</button>${i.q}<button onclick="qty(${i.p.id},1)">+</button></span></div>).join("")+<div class="row"><b>${t("sub")}</b><b>${fmt(subE())}</b></div><button class="btn" style="width:100%;margin-top:12px;padding:13px" onclick="S.cartOpen=false;go('checkout')">${t("order")}</button>:<p style="color:var(--mut)">${t("empty")}</p>}</div></div>;
  return "";
}

function draw(){
  document.getElementById("ann").textContent="🌍 "+t("ann");
  document.getElementById("q").placeholder=t("search");
  document.getElementById("sellBtn").textContent=t("sell");
  document.getElementById("cnt").textContent=S.cart.reduce((a,i)=>a+i.q,0);
  document.body.classList.toggle("anon",!S.user);
  const ub=document.getElementById("userBtn");if(ub)ub.title=S.user?S.user.name:"";
  updBadge();
  const pub=S.view==="contact"||S.view.startsWith("p:");
  document.getElementById("ft").innerHTML=footerHtml();
  document.getElementById("app").innerHTML=pub?(S.view==="contact"?contactView():pageView(S.view.slice(2))):!S.user?authView():S.view==="shop"?shop():S.view==="orders"?ordersView():S.view==="rc"?rcView():S.view==="checkout"?checkout():'';
  document.getElementById("ov").innerHTML=S.user?sheet():"";
}

const ls=document.getElementById("lang");
ls.innerHTML=LANGS.map(l=><option value="${l[0]}" ${l[0]===S.lang?'selected':''}>${l[1]}</option>).join("");
ls.onchange=()=>setLang(ls.value);

S.user=store.get("sw_me");

// Ouverture directe par lien
const urlParams = new URLSearchParams(window.location.search);
const directItem = urlParams.get('item');
if(directItem) S.det = Number(directItem);

autoDetectGeo();

if(sb){
  sb.auth.onAuthStateChange((ev,se)=>{
    const id=se&&se.user?se.user.id:null;
    if(id!==S.uid){S.uid=id;draw();setTimeout(()=>{loadOrders()},0)}
  });
  setInterval(loadOrders,15000);
  sb.auth.getSession().then(({data})=>{
    const u=data.session&&data.session.user;
    S.user=u?{name:(u.user_metadata&&u.user_metadata.name)||u.email,email:u.email}:null;
    draw();loadArticles();
  });
}else{
  loadArticles();
}
</script>
</body>
</html>
